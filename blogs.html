<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Blogs – CareerSadhana</title>
<meta name="description" content="Insights on AI careers, government hiring drives, tech trends, and career tips from the CareerSadhana team.">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0B3D91;--orange:#FF6A00;
  --bg:#07101f;--surf:#111827;--surf2:#1a2438;
  --border:rgba(255,255,255,0.08);
  --text:#f1f5f9;--muted:#94a3b8;
  --r:16px;--r-sm:10px;
  --shadow:0 8px 32px rgba(0,0,0,0.45);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
nav{position:sticky;top:0;z-index:50;background:rgba(7,16,31,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:64px}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-logo img{height:36px}
.nav-logo span{font-family:'Sora',sans-serif;font-weight:800;font-size:20px;background:linear-gradient(135deg,#fff,#cdd9f5);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-links{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav-btn{padding:7px 14px;border-radius:20px;font-size:14px;font-weight:600;color:var(--muted);text-decoration:none;transition:.2s;font-family:'Sora',sans-serif}
.nav-btn:hover,.nav-btn.active{background:rgba(255,255,255,0.08);color:#fff}
.nav-btn.active{color:var(--orange)}
.hamburger{display:none;background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
@media(max-width:768px){.nav-links{display:none;flex-direction:column;position:absolute;top:64px;left:0;right:0;background:var(--surf);padding:16px;border-bottom:1px solid var(--border)}.nav-links.open{display:flex}.hamburger{display:block}}
.hero{text-align:center;padding:72px 24px 40px;background:linear-gradient(180deg,rgba(11,61,145,0.15) 0%,transparent 100%)}
.hero h1{font-family:'Sora',sans-serif;font-size:clamp(32px,5vw,52px);font-weight:800;line-height:1.15;margin-bottom:16px}
.hero h1 span{background:linear-gradient(135deg,var(--navy),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--muted);font-size:17px;max-width:560px;margin:0 auto}
.controls{max-width:1100px;margin:32px auto;padding:0 24px;display:flex;flex-direction:column;gap:16px}
.search-wrap{position:relative}
.search-wrap input{width:100%;padding:14px 20px 14px 48px;background:var(--surf);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;font-family:'DM Sans',sans-serif;outline:none;transition:.2s}
.search-wrap input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,106,0,.12)}
.search-wrap input::placeholder{color:var(--muted)}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px;pointer-events:none}
.cat-filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cat-btn{padding:8px 16px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:.2s;font-family:'Sora',sans-serif}
.cat-btn:hover{border-color:var(--orange);color:var(--orange)}
.cat-btn.active{background:linear-gradient(135deg,var(--navy),#1655b5);border-color:var(--navy);color:#fff}
.grid-wrap{max-width:1100px;margin:0 auto;padding:0 24px 60px}
.blog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px;margin-top:24px}
.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all .25s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 48px rgba(0,0,0,0.5);border-color:rgba(255,106,0,0.3)}
.card-cover{height:160px;display:flex;align-items:center;justify-content:center;font-size:72px;background:linear-gradient(135deg,rgba(11,61,145,0.3),rgba(255,106,0,0.15));flex-shrink:0}
.card-body{padding:20px;flex:1;display:flex;flex-direction:column;gap:10px}
.card-cat{display:inline-block;padding:4px 12px;background:rgba(255,106,0,0.12);color:var(--orange);border-radius:20px;font-size:12px;font-weight:700;font-family:'Sora',sans-serif}
.card-title{font-family:'Sora',sans-serif;font-size:17px;font-weight:700;line-height:1.4;color:var(--text)}
.card-excerpt{color:var(--muted);font-size:14px;line-height:1.6;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;align-items:center;gap:12px;margin-top:4px}
.card-meta span{font-size:12px;color:var(--muted)}
.card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag-badge{padding:3px 8px;background:rgba(255,255,255,0.06);border-radius:6px;font-size:11px;color:var(--muted);font-weight:600}
.loading{text-align:center;padding:60px 24px;color:var(--muted);font-size:16px}
.loading-spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px 24px;color:var(--muted)}
.empty-icon{font-size:56px;margin-bottom:12px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px}
.modal-overlay.open{display:flex}
.modal{background:var(--surf);border:1px solid var(--border);border-radius:20px;max-width:780px;width:100%;margin:auto;padding:36px;position:relative;box-shadow:0 32px 80px rgba(0,0,0,0.6)}
.modal-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.08);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:.2s}
.modal-close:hover{background:rgba(255,255,255,0.15)}
.modal-cat{display:inline-block;padding:4px 12px;background:rgba(255,106,0,0.12);color:var(--orange);border-radius:20px;font-size:13px;font-weight:700;font-family:'Sora',sans-serif;margin-bottom:12px}
.modal-title{font-family:'Sora',sans-serif;font-size:clamp(22px,3vw,30px);font-weight:800;line-height:1.3;margin-bottom:12px}
.modal-meta{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.modal-meta span{font-size:13px;color:var(--muted)}
.modal-content{color:var(--text);line-height:1.85;font-size:16px}
.modal-content h3{font-family:'Sora',sans-serif;font-weight:700;font-size:19px;margin:24px 0 10px;color:#e2e8f0}
.modal-content p{margin-bottom:14px}
.modal-content ul,.modal-content ol{margin:12px 0 14px 24px;display:flex;flex-direction:column;gap:6px}
.modal-content li{color:var(--muted)}
.modal-content strong{color:var(--text)}
.modal-content a{color:var(--orange);text-decoration:none}
.modal-content a:hover{text-decoration:underline}
.modal-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px;padding-top:20px;border-top:1px solid var(--border)}
.modal-tags .tag-badge{padding:5px 12px;font-size:13px}
footer{background:var(--navy);color:rgba(255,255,255,0.7);text-align:center;padding:24px;font-size:13px;margin-top:60px}
footer a{color:var(--orange);text-decoration:none}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">
    <img src="logo.png" alt="CareerSadhana" onerror="this.style.display='none'">
    <span>CareerSadhana</span>
  </a>
  <button class="hamburger" id="hamburger" onclick="document.getElementById('nav-links').classList.toggle('open')">&#9776;</button>
  <div class="nav-links" id="nav-links">
    <a class="nav-btn" href="index.html">Home</a>
    <a class="nav-btn" href="ats.html">ATS Checker</a>
    <a class="nav-btn" href="jobs.html">Jobs</a>
    <a class="nav-btn" href="versant.html">Versant Test</a>
    <a class="nav-btn" href="ai-interview.html">AI Interview</a>
    <a class="nav-btn active" href="blogs.html">Blogs</a>
    <a class="nav-btn" href="about.html">About</a>
  </div>
</nav>

<section class="hero">
  <h1>Insights for the <span>Modern Job Seeker</span></h1>
  <p>AI trends, government hiring calendars, career tips, and tech insights — all in one place.</p>
</section>

<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">&#128269;</span>
    <input type="text" id="search-input" placeholder="Search articles, topics, tags..." autocomplete="off">
  </div>
  <div class="cat-filters" id="cat-filters">
    <button class="cat-btn active" data-cat="" onclick="setCategory('')">All</button>
  </div>
</div>

<div class="grid-wrap">
  <div id="blog-grid" class="blog-grid">
    <div class="loading" style="grid-column:1/-1">
      <div class="loading-spinner"></div>
      Loading articles...
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-box">
    <button class="modal-close" onclick="closeModalDirect()" title="Close">&#10005;</button>
    <div id="modal-cat" class="modal-cat"></div>
    <h2 id="modal-title" class="modal-title"></h2>
    <div class="modal-meta" id="modal-meta"></div>
    <div id="modal-content" class="modal-content"></div>
    <div id="modal-tags" class="modal-tags"></div>
  </div>
</div>

<footer>
  &copy; 2025 CareerSadhana &middot;
  <a href="privacy.html">Privacy</a> &middot;
  <a href="terms.html">Terms</a> &middot;
  <a href="about.html">About Us</a>
</footer>

<script>
var API = '/api/blogs';
var allBlogs = [];
var activeCategory = '';
var searchTimer = null;

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function fetchBlogs(category, search) {
  category = category || '';
  search = search || '';
  var grid = document.getElementById('blog-grid');
  grid.innerHTML = '<div class="loading" style="grid-column:1/-1"><div class="loading-spinner"></div>Loading articles...</div>';
  var params = new URLSearchParams();
  if (category) params.set('category', category);
  if (search) params.set('search', search);
  try {
    var res = await fetch(API + '?' + params.toString());
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to load');
    allBlogs = data.blogs || [];
    var filtersEl = document.getElementById('cat-filters');
    if (filtersEl.children.length <= 1 && (data.categories || []).length > 0) {
      data.categories.forEach(function(cat) {
        var btn = document.createElement('button');
        btn.className = 'cat-btn';
        btn.dataset.cat = cat;
        btn.textContent = cat;
        btn.onclick = function() { setCategory(cat); };
        filtersEl.appendChild(btn);
      });
    }
    renderGrid(allBlogs);
  } catch(e) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="empty-icon">&#9888;&#65039;</div><p>' + escHtml(e.message) + '</p></div>';
  }
}

function renderGrid(blogs) {
  var grid = document.getElementById('blog-grid');
  if (!blogs.length) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="empty-icon">&#128237;</div><p>No articles found. Try a different search or category.</p></div>';
    return;
  }
  grid.innerHTML = blogs.map(function(b) {
    var tags = Array.isArray(b.tags) ? b.tags : [];
    return '<div class="card" onclick="openArticle(\'' + b.id + '\')">' +
      '<div class="card-cover">' + (b.cover_emoji || '📝') + '</div>' +
      '<div class="card-body">' +
        '<span class="card-cat">' + escHtml(b.category) + '</span>' +
        '<div class="card-title">' + escHtml(b.title) + '</div>' +
        '<div class="card-excerpt">' + escHtml(b.excerpt || '') + '</div>' +
        '<div class="card-meta">' +
          '<span>&#9997;&#65039; ' + escHtml(b.author_name || 'CareerSadhana Team') + '</span>' +
          '<span>&#9203; ' + (b.read_time || 5) + ' min</span>' +
          '<span>&#128065; ' + ((b.views || 0)).toLocaleString() + '</span>' +
        '</div>' +
        (tags.length ? '<div class="card-tags">' + tags.slice(0,4).map(function(t){return '<span class="tag-badge">' + escHtml(t) + '</span>';}).join('') + '</div>' : '') +
      '</div>' +
    '</div>';
  }).join('');
}

function setCategory(cat) {
  activeCategory = cat;
  document.querySelectorAll('.cat-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.cat === cat);
  });
  fetchBlogs(cat, document.getElementById('search-input').value.trim());
}

document.getElementById('search-input').addEventListener('input', function(e) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function() {
    fetchBlogs(activeCategory, e.target.value.trim());
  }, 380);
});

async function openArticle(id) {
  var overlay = document.getElementById('modal-overlay');
  overlay.classList.add('open');
  document.getElementById('modal-title').textContent = 'Loading...';
  document.getElementById('modal-content').innerHTML = '<div class="loading"><div class="loading-spinner"></div></div>';
  document.getElementById('modal-cat').textContent = '';
  document.getElementById('modal-meta').innerHTML = '';
  document.getElementById('modal-tags').innerHTML = '';
  try {
    var res = await fetch(API + '?id=' + encodeURIComponent(id));
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to load article');
    var b = data.blog;
    document.getElementById('modal-cat').textContent = b.category;
    document.getElementById('modal-title').textContent = b.title;
    var pubDate = b.published_at ? new Date(b.published_at).toLocaleDateString('en-IN',{year:'numeric',month:'long',day:'numeric'}) : 'Recently';
    document.getElementById('modal-meta').innerHTML =
      '<span>&#9997;&#65039; ' + escHtml(b.author_name || 'CareerSadhana Team') + '</span>' +
      '<span>&#9203; ' + (b.read_time || 5) + ' min read</span>' +
      '<span>&#128065; ' + ((b.views||0)).toLocaleString() + ' views</span>' +
      '<span>&#128197; ' + pubDate + '</span>';
    document.getElementById('modal-content').innerHTML = b.content || '';
    var tags = Array.isArray(b.tags) ? b.tags : [];
    document.getElementById('modal-tags').innerHTML = tags.length
      ? tags.map(function(t){return '<span class="tag-badge">' + escHtml(t) + '</span>';}).join('')
      : '';
  } catch(e) {
    document.getElementById('modal-content').innerHTML = '<p style="color:#f72585">Error: ' + escHtml(e.message) + '</p>';
  }
}

function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modal-overlay').classList.remove('open');
}
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModalDirect(); });

fetchBlogs('', '');
</script>
</body>
</html>
